<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JIP Desktop Client</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <h1>JIP Desktop Client</h1>
    <section id="login-section">
      <h2>로그인</h2>
      <form id="login-form">
        <input type="text" id="login-id" placeholder="ID" required />
        <input type="password" id="login-pw" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      <div id="login-msg" class="msg"></div>
    </section>
    <section id="treatment-section" class="hidden">
      <h2>치료</h2>
      <div class="tabs">
        <button class="tab active" data-type="dosu">도수치료</button>
        <button class="tab" data-type="eswt">체외충격파</button>
      </div>
      <form id="treatment-form">
        <input type="date" id="date" required />
        

        
        <div class="input-group">
          <input type="hidden" id="therapist" required />
          <div id="therapist-list-container" class="chips-container therapist-grid"></div>
        </div>

        <div class="input-group relative">
          <input type="text" id="patient-search" placeholder="Search Patient (Name or No.)" autocomplete="off" />
          <div id="patient-results" class="results-container hidden"></div>
          <input type="number" id="patient-num" placeholder="Patient Number" required readonly />
          <input type="text" id="patient-name" placeholder="Patient Name" readonly disabled />
        </div>

        <div class="input-group">
          <input type="text" id="price" placeholder="Select Price" required readonly />
          <div id="price-list" class="chips-container"></div>
        </div>

        <!-- ESWT Target Area (Hidden by default) -->
        <div id="eswt-target-area" class="mt-4 hidden">
          <div class="text-md font-bold mb-2">치료부위</div>
          <div class="form-group target-radio-group d-flex flex-column">
            <label class="target-label">
              <input type="checkbox" name="target_area" value="목" data-key="1">
              <div class="custom-radio-box">1. 목</div>
            </label>
            <label class="target-label">
              <input type="checkbox" name="target_area" value="등" data-key="2">
              <div class="custom-radio-box">2. 등</div>
            </label>
            <label class="target-label">
              <input type="checkbox" name="target_area" value="허리" data-key="3">
              <div class="custom-radio-box">3. 허리</div>
            </label>
            <label class="target-label">
              <input type="checkbox" name="target_area" value="어깨" data-key="4">
              <div class="custom-radio-box">4. 어깨</div>
            </label>
            <label class="target-label">
              <input type="checkbox" name="target_area" value="팔꿈치" data-key="5">
              <div class="custom-radio-box">5. 팔꿈치</div>
            </label>
            <label class="target-label">
              <input type="checkbox" name="target_area" value="손목" data-key="6">
              <div class="custom-radio-box">6. 손목</div>
            </label>
            <label class="target-label">
              <input type="checkbox" name="target_area" value="손가락" data-key="7">
              <div class="custom-radio-box">7. 손가락</div>
            </label>
            <label class="target-label">
              <input type="checkbox" name="target_area" value="골반/고관절" data-key="8">
              <div class="custom-radio-box">8. 골반/고관절</div>
            </label>
            <label class="target-label">
              <input type="checkbox" name="target_area" value="무릎" data-key="9">
              <div class="custom-radio-box">9. 무릎</div>
            </label>
            <label class="target-label">
              <input type="checkbox" name="target_area" value="발목" data-key="0">
              <div class="custom-radio-box">0. 발목</div>
            </label>
            <label class="target-label">
              <input type="checkbox" name="target_area" value="발가락/발바닥" data-key="-">
              <div class="custom-radio-box">-. 발가락/발바닥</div>
            </label>
          </div>
        </div>

        <label><input type="checkbox" id="first-visit" />신환</label>
        <label><input type="checkbox" id="no-reserve" />예약안함</label>
        <button type="submit">저장</button>
      </form>
      <div id="treatment-msg" class="msg"></div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
